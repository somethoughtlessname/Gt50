<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT50 Component Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        input,
        textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            background: #243342;
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            padding: 4px;
            padding-top: calc((var(--card-height) * 2) + 4px);
            padding-bottom: calc((var(--card-height) * 1.5) + 4px);
            min-height: 100vh;
        }

        #frozenHeader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
        }

        #frozenTabs {
            position: fixed;
            top: var(--card-height);
            left: 0;
            right: 0;
            z-index: 1000;
        }

        #frozenFooter {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .container {
            width: 100%;
            margin: 0 auto;
        }

        .card-container {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="frozenHeader"></div>
    <div id="frozenTabs"></div>
    
    <div class="container">
        <div id="tabContent">
            <div class="card-container" id="cards-main"></div>
        </div>
    </div>

    <div id="frozenFooter"></div>
    <div id="impexWindow"></div>
    <div id="settingsWindow"></div>
    <div id="cardInfoWindow"></div>
    <div id="importWindow"></div>
    <div id="createNewWindow"></div>
    <div id="nestEditWindow"></div>

<script src="search.js"></script>    
<script src="styles.js"></script>
    
     
    
<script src="comp-header.js"></script>
<script src="comp-insert.js"></script>
<script src="comp-impex.js"></script>
<script src="comp-settings.js"></script>

<!-- IMPORT SYSTEM - Must load BEFORE create-new.js -->
<script src="Import-registry.js"></script>

<!-- IMPORT LOADER - Automatically loads imports from list -->
<script src="import/imports-list.js"></script>
<script src="import/import-loader.js"></script>

<script src="create-new.js"></script>    
<script src="comp-utility.js"></script>    
<script src="template.js"></script>

<!-- IMPORT FILES: Loaded automatically by Import-loader.js -->
<!-- Place your .js import files in /import/ folder -->
<!-- Add filenames to Imports-list.js (no manual script tags needed!) -->
<!-- Each file will auto-register itself with the import system -->
       

<script src="comp-footer.js"></script>
    
<script src="format-gt50.js"></script>
<script src="format-json.js"></script>
<script src="format-encrypted.js"></script>
<script src="format-import.js"></script>    
    
<script src="comp-list.js"></script>
<script src="comp-accumulation.js"></script>
<script src="comp-history.js"></script>
<script src="comp-progress.js"></script>
<script src="comp-tier.js"></script>
<script src="comp-checklist.js"></script>
<script src="comp-divider.js"></script>
<script src="comp-nest.js"></script>
<script src="comp-cycle.js"></script>
<script src="comp-tab.js"></script>
<script src="comp-radio.js"></script>
<script src="comp-threshold.js"></script>
<script src="comp-text.js"></script>
<script src="comp-import.js"></script>
<script src="info.js"></script>
<script src="comp-scale.js"></script>
<script src="sort-filter.js"></script>   
<script src="comp-summary.js"></script>    
    
    <script>
        // State management
        let state = {
            header: null,
            tabs: null,
            impex: null,
            settings: null,
            footer: null,
            cardInfo: null, 
            createNew: null,
            tabComponents: [[]]
        };
        
        let nextId = 1;
        let activeMode = 'view';
        let selectedInsertionPoint = 0;
        let scrollStack = [];
        let pendingDeleteId = null;
        let deleteTimeout = null;
        let pendingImportComponent = null;  // Holds import component until inserted
        
        // Preview mode state
        let previewMode = {
            active: false,
            importData: null,
            importName: '',
            insertionPoint: null  // {index, description}
        };
        
        // Expose to global scope for Sort-filter to access parent nests
        window.state = state;
        window.window.navigationStack = [];

        function resetAllTabsToFirst(tabComponentsArray) {
            if (!tabComponentsArray || !Array.isArray(tabComponentsArray)) return;
            
            tabComponentsArray.forEach(componentArray => {
                if (!Array.isArray(componentArray)) return;
                
                componentArray.forEach(component => {
                    if (component.type === 'nest' || component.type === 'cycle') {
                        if (component.state.tabs && component.state.tabs.tabs && component.state.tabs.tabs.length > 0) {
                            component.state.tabs.activeViewTab = 0;
                            component.state.tabs.selectedBuildTab = 0;
                        }
                        
                        // Close any open edit windows
                        if (component.state.editWindow) {
                            component.state.editWindow.isOpen = false;
                        }
                        
                        if (component.state.tabComponents) {
                            resetAllTabsToFirst(component.state.tabComponents);
                        }
                    }
                    
                    // Close any open import windows
                    if (component.type === 'import' && component.state.importWindow) {
                        component.state.importWindow.isOpen = false;
                    }
                });
            });
        }

        function loadState() {
            window.navigationStack = [];
            scrollStack = [];
            
            const saved = localStorage.getItem('gt50-tester-state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.nextId) nextId = parsed.nextId;
                    
                    if (parsed.header) {
                        state.header = parsed.header;
                    } else {
                        state.header = GT50Lib.Header.defaultState();
                        state.header.title = 'GT50 TESTER';
                    }
                    
                    state.header.isMain = true;
                    state.header.activeMode = activeMode;
                    
                    if (parsed.tabs) {
                        state.tabs = parsed.tabs;
                    } else {
                        state.tabs = GT50Lib.Tabs.defaultState();
                    }
                    
                    if (parsed.impex) {
                        state.impex = parsed.impex;
                    } else {
                        state.impex = GT50Lib.ImpEx.defaultState();
                    }
                    
                    if (parsed.settings) {
                        state.settings = parsed.settings;
                    } else {
                        state.settings = GT50Lib.Settings.defaultState();
                    }
                    
                    if (parsed.footer) {
                        state.footer = parsed.footer;
                    } else {
                        state.footer = GT50Lib.Footer.defaultState();
                    }
                    
                    if (parsed.cardInfo) {
                        state.cardInfo = parsed.cardInfo;
                    } else {
                        state.cardInfo = GT50Lib.CardInfo.defaultState();
                    }
                    
                    if (parsed.createNew) {
                        state.createNew = parsed.createNew;
                    } else {
                        state.createNew = GT50Lib.CreateNew.defaultState();
                    }
                    
                    state.createNew.isOpen = false;
                    
                    if (parsed.tabComponents && Array.isArray(parsed.tabComponents) && parsed.tabComponents.length > 0) {
                        state.tabComponents = parsed.tabComponents;
                    } else {
                        state.tabComponents = [[]];
                    }
                    
                    if (state.tabs.tabs.length > 0) {
                        state.tabs.activeViewTab = 0;
                        state.tabs.selectedBuildTab = 0;
                    }
                    
                    state.impex.isOpen = false;
                    state.settings.isOpen = false;
                    
                    const footerSlots = state.footer.slots;
                    for (let i = 0; i < footerSlots.length; i++) {
                        const slot = footerSlots[i];
                        
                        if ((slot.currentVariant === 'divider' || slot.currentVariant === 'text')) {
                            slot.variants = [
                                { type: 'divider', label: 'DIVIDER', color: 'var(--color-10)' },
                                { type: 'text', label: 'TEXT', color: 'var(--color-9)' }
                            ];
                            if (!slot.currentVariant) {
                                slot.currentVariant = 'divider';
                            }
                        }
                    }
                    
                } catch (e) {
                    console.error('Failed to load state:', e);
                    state.header = GT50Lib.Header.defaultState();
                    state.header.title = 'GT50 TESTER';
                    state.tabs = GT50Lib.Tabs.defaultState();
                    state.impex = GT50Lib.ImpEx.defaultState();
                    state.settings = GT50Lib.Settings.defaultState();
                    state.footer = GT50Lib.Footer.defaultState();
                    state.cardInfo = GT50Lib.CardInfo.defaultState();
                    state.createNew = GT50Lib.CreateNew.defaultState();
                    state.tabComponents = [[]];
                    
                    state.createNew.isOpen = false;
                    
                    if (state.tabs.tabs.length > 0) {
                        state.tabs.activeViewTab = 0;
                        state.tabs.selectedBuildTab = 0;
                    }
                    
                    state.impex.isOpen = false;
                    state.settings.isOpen = false;
                }
            } else {
                state.header = GT50Lib.Header.defaultState();
                state.header.title = 'GT50 TESTER';
                state.tabs = GT50Lib.Tabs.defaultState();
                state.impex = GT50Lib.ImpEx.defaultState();
                state.settings = GT50Lib.Settings.defaultState();
                state.footer = GT50Lib.Footer.defaultState();
                state.cardInfo = GT50Lib.CardInfo.defaultState();
                state.createNew = GT50Lib.CreateNew.defaultState();
                state.tabComponents = [[]];
            }
            
            state.header.isMain = true;
            state.impex.isOpen = false;
            state.settings.isOpen = false;
            state.createNew.isOpen = false;
            state.cardInfo.isOpen = false; // Close card info window on startup
            delete state.createNew.editingEntryId; // Clear any stale editing ID
            
            // ALWAYS start in view mode at main window, regardless of where user was when app closed
            activeMode = 'view';
            window.navigationStack = [];
            scrollStack = [];
            
            if (state.tabs && state.tabs.tabs && state.tabs.tabs.length > 0) {
                state.tabs.activeViewTab = 0;
                state.tabs.selectedBuildTab = 0;
            }
            resetAllTabsToFirst(state.tabComponents);
        }
        
        function saveState() {
            const toSave = {
                nextId,
                header: state.header,
                tabs: state.tabs,
                impex: state.impex,
                settings: state.settings,
                footer: state.footer,
                cardInfo: state.cardInfo,
                createNew: state.createNew,
                tabComponents: state.tabComponents,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('gt50-tester-state', JSON.stringify(toSave));
        }
        
        window.saveState = saveState;
        window.render = render;

        function getCurrentTabs() {
            if (window.navigationStack.length === 0) {
                return { tabs: state.tabs, tabComponents: state.tabComponents };
            }
            
            let current = state.tabComponents;
            let currentTabs = null;
            let currentTabComponents = null;
            
            for (const nestId of window.navigationStack) {
                const component = current.flat().find(c => c.id === nestId);
                if (!component) break;
                
                if (!component.state.tabs) {
                    component.state.tabs = GT50Lib.Tabs.defaultState();
                }
                if (!component.state.tabComponents) {
                    component.state.tabComponents = [[]];
                }
                
                currentTabs = component.state.tabs;
                currentTabComponents = component.state.tabComponents;
                current = component.state.tabComponents;
            }
            
            return { tabs: currentTabs || state.tabs, tabComponents: currentTabComponents || state.tabComponents };
        }

        function getCurrentComponents() {
            const { tabs, tabComponents } = getCurrentTabs();
            
            if (activeMode === 'build') {
                const activeTab = tabs.selectedBuildTab || 0;
                if (!tabComponents[activeTab]) {
                    tabComponents[activeTab] = [];
                }
                return tabComponents[activeTab];
            } else {
                const activeTab = tabs.activeViewTab || 0;
                if (!tabComponents[activeTab]) {
                    tabComponents[activeTab] = [];
                }
                return tabComponents[activeTab];
            }
        }

        function getCurrentNest() {
            if (window.navigationStack.length === 0) return null;
            
            let current = state.tabComponents;
            let nestComponent = null;
            
            for (const nestId of window.navigationStack) {
                const component = current.flat().find(c => c.id === nestId);
                if (!component) break;
                
                nestComponent = component;
                current = component.state.tabComponents || [[]];
            }
            
            return nestComponent;
        }

        function navigateInto(nestId) {
            scrollStack.push(window.scrollY);
            window.navigationStack.push(nestId);
            
            if (deleteTimeout) {
                clearTimeout(deleteTimeout);
                deleteTimeout = null;
            }
            pendingDeleteId = null;
            
            const currentNest = getCurrentNest();
            
            if (currentNest) {
                if (!currentNest.state.tabs) {
                    currentNest.state.tabs = GT50Lib.Tabs.defaultState();
                }
                if (!currentNest.state.tabComponents) {
                    currentNest.state.tabComponents = [[]];
                }
                
                if (currentNest.state.tabs.tabs.length > 0) {
                    // Only reset if activeViewTab is invalid (out of bounds)
                    // This preserves tab selection when clicking tab bars
                    if (currentNest.state.tabs.activeViewTab >= currentNest.state.tabs.tabs.length) {
                        currentNest.state.tabs.activeViewTab = 0;
                    }
                    // Always reset build tab to 0
                    currentNest.state.tabs.selectedBuildTab = 0;
                }
                
                if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
                    GT50Lib.Utils.closeAllDropdowns(currentNest.state.tabComponents);
                }
                
                state.header.isMain = false;
                state.header.title = currentNest.state.name || (currentNest.type === 'cycle' ? 'CYCLE' : 'SECTION');
            }
            
            selectedInsertionPoint = getCurrentComponents().length;
            
            render(true);
            window.scrollTo(0, 0);
        }

        function navigateBack() {
            if (window.navigationStack.length === 0) return;
            
            const { tabs: currentTabs } = getCurrentTabs();
            if (currentTabs && currentTabs.tabs && currentTabs.tabs.length > 0) {
                currentTabs.activeViewTab = 0;
                currentTabs.selectedBuildTab = 0;
            }
            
            window.navigationStack.pop();
            
            if (deleteTimeout) {
                clearTimeout(deleteTimeout);
                deleteTimeout = null;
            }
            pendingDeleteId = null;
            
            if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
                GT50Lib.Utils.closeAllDropdowns(state.tabComponents);
            }
            
            if (window.navigationStack.length === 0) {
                state.header.isMain = true;
                state.header.title = 'GT50 TESTER';
                activeMode = 'view';
            } else {
                const currentNest = getCurrentNest();
                if (currentNest) {
                    state.header.title = currentNest.state.name || 'SECTION';
                }
            }
            
            selectedInsertionPoint = getCurrentComponents().length;
            
            render(true);
            
            setTimeout(() => {
                const scrollPos = scrollStack.pop();
                if (scrollPos !== undefined) {
                    window.scrollTo(0, scrollPos);
                }
            }, 10);
        }

        function navigateHome() {
            resetAllTabsToFirst(state.tabComponents);
            if (state.tabs && state.tabs.tabs && state.tabs.tabs.length > 0) {
                state.tabs.activeViewTab = 0;
                state.tabs.selectedBuildTab = 0;
            }
            
            window.navigationStack = [];
            scrollStack = [];
            
            if (deleteTimeout) {
                clearTimeout(deleteTimeout);
                deleteTimeout = null;
            }
            pendingDeleteId = null;
            
            if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
                GT50Lib.Utils.closeAllDropdowns(state.tabComponents);
            }
            
            state.header.isMain = true;
            state.header.title = 'GT50 TESTER';
            activeMode = 'view';
            
            selectedInsertionPoint = getCurrentComponents().length;
            
            render(true);
            window.scrollTo(0, 0);
        }

        function openDataWindow() {
            GT50Lib.ImpEx.open(state.impex, render);
        }

        function closeDataWindow() {
            GT50Lib.ImpEx.close(state.impex, render);
        }

        function openSettingsWindow() {
            GT50Lib.Settings.open(state.settings, render);
        }

        function closeSettingsWindow() {
            GT50Lib.Settings.close(state.settings, render);
        }

        function openNewWindow() {
            state.createNew.isOpen = true;
            delete state.createNew.editingEntryId; // Clear any editing ID for fresh new entry
            render();
        }

        function closeCardInfo() {
            GT50Lib.CardInfo.close(state.cardInfo, render);
        }

        function navigateBackBuildMode() {
            // In Build mode, back button returns to create entry window
            // This re-opens the create window for the current entry
            const currentNest = getCurrentNest();
            if (currentNest) {
                // Re-open create window with current entry's data
                state.createNew.isOpen = true;
                state.createNew.editingEntryId = currentNest.id; // Store ID for potential deletion
                state.createNew.name = currentNest.state.name || '';
                state.createNew.selectedTemplate = 'custom';
                // Find color index from color name
                const colorIndex = GT50Lib.CreateNew.colors.findIndex(c => c.name === currentNest.state.color);
                state.createNew.currentColorIndex = colorIndex >= 0 ? colorIndex : 0;
                state.createNew.cycleMode = currentNest.type === 'cycle';
                state.createNew.summaryState = {
                    showSummary: currentNest.state.showSummary || false,
                    summaryIncludeChildren: currentNest.state.summaryIncludeChildren || false,
                    summaryDisplayMode: currentNest.state.summaryDisplayMode || null
                };
                
                // Navigate back first, then switch to view mode
                navigateBack();
                activeMode = 'view';
                render();
            }
        }

        function navigateHomeBuildMode() {
            // In Build mode, home button saves and returns to previous view mode
            saveState();
            navigateBack();
            activeMode = 'view';
            render(true);
        }

        function renderHeader() {
            const headerContainer = document.getElementById('frozenHeader');
            if (!headerContainer) return;
            
            // Pending import mode gets custom header
            if (pendingImportComponent) {
                headerContainer.innerHTML = `
                    <div style="
                        height: var(--card-height);
                        background: var(--bg-3);
                        border-bottom: var(--border-width) solid var(--border-color);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <div style="
                            font-size: 14px;
                            font-weight: 700;
                            color: var(--color-10);
                            text-transform: uppercase;
                        ">IMPORT: ${pendingImportComponent.state.name}</div>
                    </div>
                `;
                return;
            }
            
            if (activeMode === 'build') {
                // In build mode, use special navigation functions for back/home
                GT50Lib.Header.renderBuild(headerContainer, state.header, render, navigateBackBuildMode, navigateHomeBuildMode, switchMode, activeMode, openDataWindow, openSettingsWindow, openNewWindow);
            } else {
                GT50Lib.Header.renderView(headerContainer, state.header, render, navigateBack, navigateHome, switchMode, activeMode, openDataWindow, openSettingsWindow, openNewWindow);
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('frozenTabs');
            if (!tabsContainer) return;
            
            // Hide tabs in pending import mode
            if (pendingImportComponent) {
                tabsContainer.style.display = 'none';
                document.body.style.paddingTop = 'calc(var(--card-height) + 4px)';
                return;
            }
            
            const currentContext = getCurrentTabs();
            
            const targetLength = Math.max(1, currentContext.tabs.tabs.length);
            
            while (currentContext.tabComponents.length < targetLength) {
                currentContext.tabComponents.push([]);
            }
            while (currentContext.tabComponents.length > targetLength) {
                currentContext.tabComponents.pop();
            }
            
            if (currentContext.tabs.activeViewTab >= currentContext.tabs.tabs.length && currentContext.tabs.tabs.length > 0) {
                currentContext.tabs.activeViewTab = currentContext.tabs.tabs.length - 1;
            } else if (currentContext.tabs.tabs.length === 0) {
                currentContext.tabs.activeViewTab = 0;
            }
            
            if (activeMode === 'view' && currentContext.tabs.tabs.length === 0) {
                tabsContainer.style.display = 'none';
                document.body.style.paddingTop = 'calc(var(--card-height) + 4px)';
                return;
            } else {
                tabsContainer.style.display = '';
                document.body.style.paddingTop = 'calc((var(--card-height) * 2) + var(--border-width) + 5px)';
            }
            
            if (activeMode === 'build') {
                GT50Lib.Tabs.renderBuild(tabsContainer, currentContext.tabs, render);
            } else {
                GT50Lib.Tabs.renderView(tabsContainer, currentContext.tabs, render);
            }
        }

        function renderFooter() {
            const footerContainer = document.getElementById('frozenFooter');
            if (!footerContainer) return;
            
            // Pending import mode gets special footer
            if (pendingImportComponent) {
                GT50Lib.Footer.renderPreview(
                    footerContainer,
                    {
                        active: true,
                        importName: pendingImportComponent.state.name,
                        insertionPoint: { index: selectedInsertionPoint }
                    },
                    // onInsert callback - Add component and auto-trigger import
                    () => {
                        const currentComponents = getCurrentComponents();
                        currentComponents.splice(selectedInsertionPoint, 0, pendingImportComponent);
                        
                        // Auto-trigger the import transformation
                        const importId = pendingImportComponent.state.selectedImportId;
                        if (importId) {
                            const parseResult = window.GT50.Imports.parseImportData(importId);
                            
                            if (parseResult.success) {
                                // Transform the import component to nest
                                pendingImportComponent.type = 'nest';
                                
                                if (parseResult.data) {
                                    pendingImportComponent.state = {
                                        name: pendingImportComponent.state.name,
                                        tabs: parseResult.data.tabs,
                                        tabComponents: parseResult.data.tabComponents,
                                        color: 'GRAY',
                                        autoSortByLastUpdated: false,
                                        showSummary: false
                                    };
                                }
                            }
                        }
                        
                        // Clear pending state and return to view
                        pendingImportComponent = null;
                        activeMode = 'view';
                        saveState();
                        render();
                    },
                    // onCancel callback
                    () => {
                        pendingImportComponent = null;
                        activeMode = 'view';
                        render();
                    }
                );
                
                return;
            }
            
            // Preview mode gets special footer using Footer.renderPreview()
            if (previewMode.active) {
                GT50Lib.Footer.renderPreview(
                    footerContainer,
                    previewMode,
                    // onInsert callback
                    () => {
                        if (!previewMode.insertionPoint) return;
                        
                        // Insert the preview data at the marked insertion point
                        const currentComponents = getCurrentComponents();
                        const insertIndex = previewMode.insertionPoint.index;
                        
                        // Parse the data to create components
                        if (previewMode.importData && previewMode.importData.tabComponents && previewMode.importData.tabComponents[0]) {
                            const componentsToInsert = previewMode.importData.tabComponents[0];
                            
                            // Assign new IDs to all components
                            function assignNewIds(comps) {
                                comps.forEach(comp => {
                                    comp.id = nextId++;
                                    if ((comp.type === 'nest' || comp.type === 'cycle') && comp.state.tabComponents) {
                                        comp.state.tabComponents.forEach(assignNewIds);
                                    }
                                });
                            }
                            assignNewIds(componentsToInsert);
                            
                            // Insert at the marked position
                            currentComponents.splice(insertIndex, 0, ...componentsToInsert);
                        }
                        
                        // Exit preview mode
                        previewMode.active = false;
                        previewMode.importData = null;
                        previewMode.importName = '';
                        previewMode.insertionPoint = null;
                        activeMode = 'view';
                        saveState();
                        render();
                    },
                    // onCancel callback
                    () => {
                        previewMode.active = false;
                        previewMode.importData = null;
                        previewMode.importName = '';
                        previewMode.insertionPoint = null;
                        activeMode = 'view';
                        render();
                    }
                );
                
                return;
            }
            
            // Normal footer for build mode
            const visible = activeMode === 'build';
            GT50Lib.Footer.render(footerContainer, state.footer, visible, addComponent);
        }

        function renderImpEx() {
            const impexContainer = document.getElementById('impexWindow');
            if (!impexContainer) return;
            
            GT50Lib.ImpEx.render(impexContainer, state.impex, render, closeDataWindow, state);
        }

        function renderSettings() {
    const settingsContainer = document.getElementById('settingsWindow');
    if (!settingsContainer) return;
    
    GT50Lib.Settings.render(settingsContainer, state.settings, render, closeSettingsWindow, state.cardInfo);
}

        function renderCardInfo() {
            const cardInfoContainer = document.getElementById('cardInfoWindow');
            if (!cardInfoContainer) return;
            
            GT50Lib.CardInfo.render(cardInfoContainer, state.cardInfo, closeCardInfo);
        }

        function renderImportWindow() {
            const importContainer = document.getElementById('importWindow');
            if (!importContainer) return;
            
            function findOpenImportComponent(tabComponentsArray) {
                for (const components of tabComponentsArray) {
                    if (!Array.isArray(components)) continue;
                    
                    for (const comp of components) {
                        if (comp.type === 'import' && comp.state.importWindow && comp.state.importWindow.isOpen) {
                            return comp;
                        }
                        if ((comp.type === 'nest' || comp.type === 'cycle') && comp.state.tabComponents) {

function renderNestEditWindow() {
    const container = document.getElementById('nestEditWindow');
    if (!container) return;
    
    // Find any nest or cycle component with an open edit window OR pending type change
    function findOpenEditNest(tabComponentsArray) {
        if (!Array.isArray(tabComponentsArray)) return null;
        
        for (const components of tabComponentsArray) {
            if (!Array.isArray(components)) continue;
            
            for (const comp of components) {
                // Check if this is a nest or cycle with open edit window
                if ((comp.type === 'nest' || comp.type === 'cycle') && comp.state.editWindow && comp.state.editWindow.isOpen) {
                    return comp;
                }
                // Also check for pending type changes even if window is closed
                if ((comp.type === 'nest' || comp.type === 'cycle') && comp.state._pendingTypeChange) {
                    return comp;
                }
                // Recursively check nested structures
                if ((comp.type === 'nest' || comp.type === 'cycle') && comp.state.tabComponents) {
                    const found = findOpenEditNest(comp.state.tabComponents);
                    if (found) return found;
                }
            }
        }
        return null;
    }
    
    const openEditNest = findOpenEditNest(state.tabComponents);
    
    // Handle pending type conversions FIRST, before any rendering
    if (openEditNest && openEditNest.state._pendingTypeChange) {
        const newType = openEditNest.state._pendingTypeChange;
        
        if (newType !== openEditNest.type) {
            if (newType === 'cycle' && openEditNest.type === 'nest') {
                // Converting nest to cycle - add cycle properties
                openEditNest.type = 'cycle';
                openEditNest.state.resetInterval = 'daily';
                openEditNest.state.lastReset = Date.now();
                openEditNest.state.resetTime = '00:00';
                openEditNest.state.resetDay = 1;
                openEditNest.state.resetHour = 0;
                openEditNest.state.customMonths = 0;
                openEditNest.state.customDays = 0;
                openEditNest.state.customHours = 0;
                openEditNest.state.customMinutes = 0;
                openEditNest.state.customDropdownOpen = false;
                openEditNest.state.showCountdown = true;
                openEditNest.state.countdownColor = 'var(--color-5)';
            } else if (newType === 'nest' && openEditNest.type === 'cycle') {
                // Converting cycle to nest - remove cycle properties
                openEditNest.type = 'nest';
                delete openEditNest.state.resetInterval;
                delete openEditNest.state.lastReset;
                delete openEditNest.state.resetTime;
                delete openEditNest.state.resetDay;
                delete openEditNest.state.resetHour;
                delete openEditNest.state.customMonths;
                delete openEditNest.state.customDays;
                delete openEditNest.state.customHours;
                delete openEditNest.state.customMinutes;
                delete openEditNest.state.customDropdownOpen;
                delete openEditNest.state.showCountdown;
                delete openEditNest.state.countdownColor;
            }
        }
        
        delete openEditNest.state._pendingTypeChange;
    }
    
    if (openEditNest && openEditNest.state.editWindow && openEditNest.state.editWindow.isOpen) {
        // Call the appropriate edit window renderer based on type
        if (openEditNest.type === 'cycle') {
            GT50Lib.Cycle.renderEditWindow(
                container,
                openEditNest.state,
                render,  // onChange
                () => {
                    // onClose - close without saving
                    openEditNest.state.editWindow.isOpen = false;
                    delete openEditNest.state._pendingTypeChange;
                    render();
                },
                () => {
                    // onSaveAndClose - for Cycle, just use same as old onSave for now
                    openEditNest.state.editWindow.isOpen = false;
                    activeMode = 'build';
                    saveState();
                    navigateInto(openEditNest.id);
                },
                null  // onSaveAndOpen - not implemented for Cycle yet
            );
        } else {
            GT50Lib.Nest.renderEditWindow(
                container,
                openEditNest.state,
                render,  // onChange
                () => {
                    // onClose - close without saving
                    openEditNest.state.editWindow.isOpen = false;
                    delete openEditNest.state._pendingTypeChange;
                    
                    // Check if home button was pressed  
                    if (openEditNest.state.editWindow._navigateHomeAfterClose) {
                        delete openEditNest.state.editWindow._navigateHomeAfterClose;
                        
                        // FORCE COMPLETE NAVIGATION TO ROOT
                        window.navigationStack = [];
                        state.header.isMain = true;
                        state.header.title = 'GT50 TESTER';
                        activeMode = 'view';
                        selectedInsertionPoint = getCurrentComponents().length;
                        
                        render(true);
                        window.scrollTo(0, 0);
                        return;
                    }
                    
                    render();
                },
                () => {
                    // onSaveAndClose - save changes and close (no navigation)
                    openEditNest.state.editWindow.isOpen = false;
                    saveState();
                    render();
                },
                () => {
                    // onSaveAndOpen - save changes and navigate into nest in BUILD mode
                    openEditNest.state.editWindow.isOpen = false;
                    activeMode = 'build';  // Switch to build mode before navigating
                    saveState();
                    navigateInto(openEditNest.id);
                }
            );
        }
    } else {
        container.innerHTML = '';
        container.style.display = 'none';
    }
}

                        section.style.padding = `${currentPadding} ${currentPadding} 0 ${currentPadding}`;
                        
                        const lastChild = section.lastElementChild;
                        if (lastChild && !lastChild.style.marginBottom) {
                            lastChild.style.marginBottom = currentPadding;
                        }
                    });
                    
                    container.appendChild(componentWrapper);
                }
                
                if (component.type === 'divider' || component.type === 'scale' || component.type === 'nest' || component.type === 'cycle') {
    container.appendChild(componentWrapper);
}
            });
            
            // INJECT SEARCH BAR AT THE END
if (GT50Lib.Search) {
    const isMainWindow = window.navigationStack.length === 0;
    GT50Lib.Search.inject(container, { visible: isMainWindow });
}
        }

        function switchMode() {
    activeMode = activeMode === 'build' ? 'view' : 'build';
    
    // When switching to view mode, remove all import components
    if (activeMode === 'view') {
        const components = getCurrentComponents();
        const filtered = components.filter(c => c.type !== 'import');
        
        // Replace the array contents
        components.length = 0;
        components.push(...filtered);
        
        // Reset selector to bottom when entering View mode
        selectedInsertionPoint = getCurrentComponents().length;
    } else if (activeMode === 'build') {
        // Reset selector to bottom when entering Build mode
        selectedInsertionPoint = getCurrentComponents().length;
    }
    
    const components = getCurrentComponents();
    
    if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
        GT50Lib.Utils.closeAllDropdowns([components]);
    }
    
    render(true);
}

        function addComponent(type) {
            const components = getCurrentComponents();
            
            let newComponent = null;
            
            if (type === 'divider') {
                newComponent = {
                    id: nextId++,
                    type: 'divider',
                    state: GT50Lib.Divider.defaultState()
                };
            } else if (type === 'text') {
    newComponent = {
        id: nextId++,
        type: 'text',
        state: GT50Lib.Text.defaultState()
    };
} else if (type === 'scale') {
    newComponent = {
        id: nextId++,
        type: 'scale',
        state: GT50Lib.Scale.defaultState()
    };
} else if (type === 'list') {
                newComponent = {
                    id: nextId++,
                    type: 'list',
                    state: GT50Lib.List.defaultState()
                };
            } else if (type === 'accumulation') {
                newComponent = {
                    id: nextId++,
                    type: 'accumulation',
                    state: GT50Lib.Accumulation.defaultState()
                };
            } else if (type === 'history') {
                newComponent = {
                    id: nextId++,
                    type: 'history',
                    state: GT50Lib.History.defaultState()
                };
            } else if (type === 'progress') {
                newComponent = {
                    id: nextId++,
                    type: 'progress',
                    state: GT50Lib.Progress.defaultState()
                };
            } else if (type === 'tier') {
                newComponent = {
                    id: nextId++,
                    type: 'tier',
                    state: GT50Lib.Tier.defaultState()
                };
            } else if (type === 'checklist') {
                newComponent = {
                    id: nextId++,
                    type: 'checklist',
                    state: GT50Lib.Checklist.defaultState()
                };
            } else if (type === 'radio') {
                newComponent = {
                    id: nextId++,
                    type: 'radio',
                    state: GT50Lib.Radio.defaultState()
                };
            } else if (type === 'threshold') {
                newComponent = {
                    id: nextId++,
                    type: 'threshold',
                    state: GT50Lib.Threshold.defaultState()
                };
                
                } else if (type === 'nest') {
    newComponent = {
        id: nextId++,
        type: 'nest',
        state: GT50Lib.Nest.defaultState()
    };
} else if (type === 'cycle') {
    newComponent = {
        id: nextId++,
        type: 'cycle',
        state: GT50Lib.Cycle.defaultState()
    };
} else if (type === 'import') {
    newComponent = {
        id: nextId++,
        type: 'import',
        state: GT50Lib.Import.defaultState()
    };

            }
            
            if (newComponent) {
                components.splice(selectedInsertionPoint, 0, newComponent);
                
                selectedInsertionPoint = Math.min(selectedInsertionPoint + 1, components.length);
                
                render();
            }
        }

        function moveComponent(id, direction) {
    const components = getCurrentComponents();
    const idx = components.findIndex(c => c.id === id);
    if (direction === -1 && idx > 0) {
        [components[idx], components[idx - 1]] = [components[idx - 1], components[idx]];
    } else if (direction === 1 && idx < components.length - 1) {
        [components[idx], components[idx + 1]] = [components[idx + 1], components[idx]];
    }
    render();
}

        function deleteComponent(id) {
    const components = getCurrentComponents();
    const index = components.findIndex(c => c.id === id);
    
    if (index === -1) return;
    
    console.log('Delete tap:', id, 'pending:', pendingDeleteId, 'match:', pendingDeleteId === id);
    
    if (pendingDeleteId === id) {
        // Second tap - delete immediately without modal
        components.splice(index, 1);
            
        if (selectedInsertionPoint > index) {
            selectedInsertionPoint = Math.max(0, selectedInsertionPoint - 1);
        } else if (selectedInsertionPoint >= components.length) {
            selectedInsertionPoint = components.length;
        }

        clearTimeout(deleteTimeout);
        deleteTimeout = null;
        pendingDeleteId = null;
        
        render();
    } else {
        // First tap - set pending state
        if (deleteTimeout) {
            clearTimeout(deleteTimeout);
        }
        
        pendingDeleteId = id;
        
        deleteTimeout = setTimeout(() => {
            pendingDeleteId = null;
            deleteTimeout = null;
            render();
        }, 3000);
        
        render();
    }
}
        loadState();
        GT50Lib.Header.editSectionVisible = false;  // ← ADD THIS LINE
        render();
        
        // ===== KEYBOARD HANDLING FOR MOBILE =====
        let focusedInput = null;
let initialViewportHeight = window.innerHeight;

// Scroll helper - positions input at consistent location (just above footer)
function scrollInputIntoView(input) {
    if (!input) return;
    
    setTimeout(() => {
        const rect = input.getBoundingClientRect();
        const currentHeight = window.visualViewport ? 
            window.visualViewport.height : window.innerHeight;
        
        // Footer total height: 67.5 base + 22.5 dropdown + 20 safety = 110px
        const footerSpace = 90;
        
        // Target: position input just above footer (110px from bottom)
        const targetPosition = currentHeight - footerSpace - (rect.height / 2);
        
        // Calculate how much to scroll to get input to target position
        const currentPosition = rect.top;
        const scrollAmount = currentPosition - targetPosition;
        
        // Always scroll to position input at target location
        if (Math.abs(scrollAmount) > 5) { // Only scroll if difference > 5px
            window.scrollBy({
                top: scrollAmount,
                behavior: 'smooth'
            });
        }
    }, 200); // Wait for keyboard animation
}

// Track when input gets focus
document.addEventListener('focusin', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        focusedInput = e.target;
        initialViewportHeight = window.visualViewport ? 
            window.visualViewport.height : window.innerHeight;
        scrollInputIntoView(focusedInput);
    }
});

document.addEventListener('focusout', () => {
    focusedInput = null;
});

// Handle keyboard open/close
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
        if (focusedInput) {
            const currentHeight = window.visualViewport.height;
            const heightDiff = initialViewportHeight - currentHeight;
            
            // Keyboard opened (viewport shrunk by more than 100px)
            if (heightDiff > 100) {
                scrollInputIntoView(focusedInput);
            }
        }
    });
}

window.addEventListener('beforeunload', saveState);
setInterval(saveState, 5000);
    </script>

    <script>
        // State management
        let state = {
            header: null,
            tabs: null,
            impex: null,
            settings: null,
            footer: null,
            cardInfo: null, 
            createNew: null,
            tabComponents: [[]]
        };
        
        let nextId = 1;
        let activeMode = 'view';
        let selectedInsertionPoint = 0;
        let scrollStack = [];
        let pendingDeleteId = null;
        let deleteTimeout = null;
        
        // Expose to global scope for Sort-filter to access parent nests
        window.state = state;
        window.window.navigationStack = [];

        function resetAllTabsToFirst(tabComponentsArray) {
            if (!tabComponentsArray || !Array.isArray(tabComponentsArray)) return;
            
            tabComponentsArray.forEach(componentArray => {
                if (!Array.isArray(componentArray)) return;
                
                componentArray.forEach(component => {
                    if (component.type === 'nest' || component.type === 'cycle') {
                        if (component.state.tabs && component.state.tabs.tabs && component.state.tabs.tabs.length > 0) {
                            component.state.tabs.activeViewTab = 0;
                            component.state.tabs.selectedBuildTab = 0;
                        }
                        
                        // Close any open edit windows
                        if (component.state.editWindow) {
                            component.state.editWindow.isOpen = false;
                        }
                        
                        if (component.state.tabComponents) {
                            resetAllTabsToFirst(component.state.tabComponents);
                        }
                    }
                    
                    // Close any open import windows
                    if (component.type === 'import' && component.state.importWindow) {
                        component.state.importWindow.isOpen = false;
                    }
                });
            });
        }

        function loadState() {
            window.navigationStack = [];
            scrollStack = [];
            
            const saved = localStorage.getItem('gt50-tester-state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.nextId) nextId = parsed.nextId;
                    
                    if (parsed.header) {
                        state.header = parsed.header;
                    } else {
                        state.header = GT50Lib.Header.defaultState();
                        state.header.title = 'GT50 TESTER';
                    }
                    
                    state.header.isMain = true;
                    state.header.activeMode = activeMode;
                    
                    if (parsed.tabs) {
                        state.tabs = parsed.tabs;
                    } else {
                        state.tabs = GT50Lib.Tabs.defaultState();
                    }
                    
                    if (parsed.impex) {
                        state.impex = parsed.impex;
                    } else {
                        state.impex = GT50Lib.ImpEx.defaultState();
                    }
                    
                    if (parsed.settings) {
                        state.settings = parsed.settings;
                    } else {
                        state.settings = GT50Lib.Settings.defaultState();
                    }
                    
                    if (parsed.footer) {
                        state.footer = parsed.footer;
                    } else {
                        state.footer = GT50Lib.Footer.defaultState();
                    }
                    
                    if (parsed.cardInfo) {
                        state.cardInfo = parsed.cardInfo;
                    } else {
                        state.cardInfo = GT50Lib.CardInfo.defaultState();
                    }
                    
                    if (parsed.createNew) {
                        state.createNew = parsed.createNew;
                    } else {
                        state.createNew = GT50Lib.CreateNew.defaultState();
                    }
                    
                    state.createNew.isOpen = false;
                    
                    if (parsed.tabComponents && Array.isArray(parsed.tabComponents) && parsed.tabComponents.length > 0) {
                        state.tabComponents = parsed.tabComponents;
                    } else {
                        state.tabComponents = [[]];
                    }
                    
                    if (state.tabs.tabs.length > 0) {
                        state.tabs.activeViewTab = 0;
                        state.tabs.selectedBuildTab = 0;
                    }
                    
                    state.impex.isOpen = false;
                    state.settings.isOpen = false;
                    
                    const footerSlots = state.footer.slots;
                    for (let i = 0; i < footerSlots.length; i++) {
                        const slot = footerSlots[i];
                        
                        if ((slot.currentVariant === 'divider' || slot.currentVariant === 'text')) {
                            slot.variants = [
                                { type: 'divider', label: 'DIVIDER', color: 'var(--color-10)' },
                                { type: 'text', label: 'TEXT', color: 'var(--color-9)' }
                            ];
                            if (!slot.currentVariant) {
                                slot.currentVariant = 'divider';
                            }
                        }
                    }
                    
                } catch (e) {
                    console.error('Failed to load state:', e);
                    state.header = GT50Lib.Header.defaultState();
                    state.header.title = 'GT50 TESTER';
                    state.tabs = GT50Lib.Tabs.defaultState();
                    state.impex = GT50Lib.ImpEx.defaultState();
                    state.settings = GT50Lib.Settings.defaultState();
                    state.footer = GT50Lib.Footer.defaultState();
                    state.cardInfo = GT50Lib.CardInfo.defaultState();
                    state.createNew = GT50Lib.CreateNew.defaultState();
                    state.tabComponents = [[]];
                    
                    state.createNew.isOpen = false;
                    
                    if (state.tabs.tabs.length > 0) {
                        state.tabs.activeViewTab = 0;
                        state.tabs.selectedBuildTab = 0;
                    }
                    
                    state.impex.isOpen = false;
                    state.settings.isOpen = false;
                }
            } else {
                state.header = GT50Lib.Header.defaultState();
                state.header.title = 'GT50 TESTER';
                state.tabs = GT50Lib.Tabs.defaultState();
                state.impex = GT50Lib.ImpEx.defaultState();
                state.settings = GT50Lib.Settings.defaultState();
                state.footer = GT50Lib.Footer.defaultState();
                state.cardInfo = GT50Lib.CardInfo.defaultState();
                state.createNew = GT50Lib.CreateNew.defaultState();
                state.tabComponents = [[]];
            }
            
            state.header.isMain = true;
            state.impex.isOpen = false;
            state.settings.isOpen = false;
            state.createNew.isOpen = false;
            state.cardInfo.isOpen = false; // Close card info window on startup
            delete state.createNew.editingEntryId; // Clear any stale editing ID
            
            // ALWAYS start in view mode at main window, regardless of where user was when app closed
            activeMode = 'view';
            window.navigationStack = [];
            scrollStack = [];
            
            if (state.tabs && state.tabs.tabs && state.tabs.tabs.length > 0) {
                state.tabs.activeViewTab = 0;
                state.tabs.selectedBuildTab = 0;
            }
            resetAllTabsToFirst(state.tabComponents);
        }
        
        function saveState() {
            const toSave = {
                nextId,
                header: state.header,
                tabs: state.tabs,
                impex: state.impex,
                settings: state.settings,
                footer: state.footer,
                cardInfo: state.cardInfo,
                createNew: state.createNew,
                tabComponents: state.tabComponents,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('gt50-tester-state', JSON.stringify(toSave));
        }
        
        window.saveState = saveState;
        window.render = render;

        function getCurrentTabs() {
            if (window.navigationStack.length === 0) {
                return { tabs: state.tabs, tabComponents: state.tabComponents };
            }
            
            let current = state.tabComponents;
            let currentTabs = null;
            let currentTabComponents = null;
            
            for (const nestId of window.navigationStack) {
                const component = current.flat().find(c => c.id === nestId);
                if (!component) break;
                
                if (!component.state.tabs) {
                    component.state.tabs = GT50Lib.Tabs.defaultState();
                }
                if (!component.state.tabComponents) {
                    component.state.tabComponents = [[]];
                }
                
                currentTabs = component.state.tabs;
                currentTabComponents = component.state.tabComponents;
                current = component.state.tabComponents;
            }
            
            return { tabs: currentTabs || state.tabs, tabComponents: currentTabComponents || state.tabComponents };
        }

        function getCurrentComponents() {
            const { tabs, tabComponents } = getCurrentTabs();
            
            if (activeMode === 'build') {
                const activeTab = tabs.selectedBuildTab || 0;
                if (!tabComponents[activeTab]) {
                    tabComponents[activeTab] = [];
                }
                return tabComponents[activeTab];
            } else {
                const activeTab = tabs.activeViewTab || 0;
                if (!tabComponents[activeTab]) {
                    tabComponents[activeTab] = [];
                }
                return tabComponents[activeTab];
            }
        }

        function getCurrentNest() {
            if (window.navigationStack.length === 0) return null;
            
            let current = state.tabComponents;
            let nestComponent = null;
            
            for (const nestId of window.navigationStack) {
                const component = current.flat().find(c => c.id === nestId);
                if (!component) break;
                
                nestComponent = component;
                current = component.state.tabComponents || [[]];
            }
            
            return nestComponent;
        }

        function navigateInto(nestId) {
            scrollStack.push(window.scrollY);
            window.navigationStack.push(nestId);
            
            if (deleteTimeout) {
                clearTimeout(deleteTimeout);
                deleteTimeout = null;
            }
            pendingDeleteId = null;
            
            const currentNest = getCurrentNest();
            
            if (currentNest) {
                if (!currentNest.state.tabs) {
                    currentNest.state.tabs = GT50Lib.Tabs.defaultState();
                }
                if (!currentNest.state.tabComponents) {
                    currentNest.state.tabComponents = [[]];
                }
                
                if (currentNest.state.tabs.tabs.length > 0) {
                    // Only reset if activeViewTab is invalid (out of bounds)
                    // This preserves tab selection when clicking tab bars
                    if (currentNest.state.tabs.activeViewTab >= currentNest.state.tabs.tabs.length) {
                        currentNest.state.tabs.activeViewTab = 0;
                    }
                    // Always reset build tab to 0
                    currentNest.state.tabs.selectedBuildTab = 0;
                }
                
                if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
                    GT50Lib.Utils.closeAllDropdowns(currentNest.state.tabComponents);
                }
                
                state.header.isMain = false;
                state.header.title = currentNest.state.name || (currentNest.type === 'cycle' ? 'CYCLE' : 'SECTION');
            }
            
            selectedInsertionPoint = getCurrentComponents().length;
            
            render(true);
            window.scrollTo(0, 0);
        }

        function navigateBack() {
            if (window.navigationStack.length === 0) return;
            
            const { tabs: currentTabs } = getCurrentTabs();
            if (currentTabs && currentTabs.tabs && currentTabs.tabs.length > 0) {
                currentTabs.activeViewTab = 0;
                currentTabs.selectedBuildTab = 0;
            }
            
            window.navigationStack.pop();
            
            if (deleteTimeout) {
                clearTimeout(deleteTimeout);
                deleteTimeout = null;
            }
            pendingDeleteId = null;
            
            if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
                GT50Lib.Utils.closeAllDropdowns(state.tabComponents);
            }
            
            if (window.navigationStack.length === 0) {
                state.header.isMain = true;
                state.header.title = 'GT50 TESTER';
                activeMode = 'view';
            } else {
                const currentNest = getCurrentNest();
                if (currentNest) {
                    state.header.title = currentNest.state.name || 'SECTION';
                }
            }
            
            selectedInsertionPoint = getCurrentComponents().length;
            
            render(true);
            
            setTimeout(() => {
                const scrollPos = scrollStack.pop();
                if (scrollPos !== undefined) {
                    window.scrollTo(0, scrollPos);
                }
            }, 10);
        }

        function navigateHome() {
            resetAllTabsToFirst(state.tabComponents);
            if (state.tabs && state.tabs.tabs && state.tabs.tabs.length > 0) {
                state.tabs.activeViewTab = 0;
                state.tabs.selectedBuildTab = 0;
            }
            
            window.navigationStack = [];
            scrollStack = [];
            
            if (deleteTimeout) {
                clearTimeout(deleteTimeout);
                deleteTimeout = null;
            }
            pendingDeleteId = null;
            
            if (GT50Lib.Utils && GT50Lib.Utils.closeAllDropdowns) {
                GT50Lib.Utils.closeAllDropdowns(state.tabComponents);
            }
            
            state.header.isMain = true;
            state.header.title = 'GT50 TESTER';
            activeMode = 'view';
            
            selectedInsertionPoint = getCurrentComponents().length;
            
            render(true);
            window.scrollTo(0, 0);
        }

        function openDataWindow() {
            GT50Lib.ImpEx.open(state.impex, render);
        }

        function closeDataWindow() {
            GT50Lib.ImpEx.close(state.impex, render);
        }

        function openSettingsWindow() {
            GT50Lib.Settings.open(state.settings, render);
        }

        function closeSettingsWindow() {
            GT50Lib.Settings.close(state.settings, render);
        }

        function openNewWindow() {
            state.createNew.isOpen = true;
            delete state.createNew.editingEntryId; // Clear any editing ID for fresh new entry
            render();
        }

        function closeCardInfo() {
            GT50Lib.CardInfo.close(state.cardInfo, render);
        }

        function navigateBackBuildMode() {
            // In Build mode, back button returns to create entry window
            // This re-opens the create window for the current entry
            const currentNest = getCurrentNest();
            if (currentNest) {
                // Re-open create window with current entry's data
                state.createNew.isOpen = true;
                state.createNew.editingEntryId = currentNest.id; // Store ID for potential deletion
                state.createNew.name = currentNest.state.name || '';
                state.createNew.selectedTemplate = 'custom';
                // Find color index from color name
                const colorIndex = GT50Lib.CreateNew.colors.findIndex(c => c.name === currentNest.state.color);
                state.createNew.currentColorIndex = colorIndex >= 0 ? colorIndex : 0;
                state.createNew.cycleMode = currentNest.type === 'cycle';
                state.createNew.summaryState = {
                    showSummary: currentNest.state.showSummary || false,
                    summaryIncludeChildren: currentNest.state.summaryIncludeChildren || false,
                    summaryDisplayMode: currentNest.state.summaryDisplayMode || null
                };
                
                // Navigate back first, then switch to view mode
                navigateBack();
                activeMode = 'view';
                render();
            }
        }

        function navigateHomeBuildMode() {
            // In Build mode, home button saves and returns to previous view mode
            saveState();
            navigateBack();
            activeMode = 'view';
            render(true);
        }

        function renderHeader() {
            const headerContainer = document.getElementById('frozenHeader');
            if (!headerContainer) return;
            
            if (activeMode === 'build') {
                // In build mode, use special navigation functions for back/home
                GT50Lib.Header.renderBuild(headerContainer, state.header, render, navigateBackBuildMode, navigateHomeBuildMode, switchMode, activeMode, openDataWindow, openSettingsWindow, openNewWindow);
            } else {
                GT50Lib.Header.renderView(headerContainer, state.header, render, navigateBack, navigateHome, switchMode, activeMode, openDataWindow, openSettingsWindow, openNewWindow);
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('frozenTabs');
            if (!tabsContainer) return;
            
            const currentContext = getCurrentTabs();
            
            const targetLength = Math.max(1, currentContext.tabs.tabs.length);
            
            while (currentContext.tabComponents.length < targetLength) {
                currentContext.tabComponents.push([]);
            }
            while (currentContext.tabComponents.length > targetLength) {
                currentContext.tabComponents.pop();
            }
            
            if (currentContext.tabs.activeViewTab >= currentContext.tabs.tabs.length && currentContext.tabs.tabs.length > 0) {
                currentContext.tabs.activeViewTab = currentContext.tabs.tabs.length - 1;
            } else if (currentContext.tabs.tabs.length === 0) {
                currentContext.tabs.activeViewTab = 0;
            }
            
            if (activeMode === 'view' && currentContext.tabs.tabs.length === 0) {
                tabsContainer.style.display = 'none';
                document.body.style.paddingTop = 'calc(var(--card-height) + 4px)';
                return;
            } else {
                tabsContainer.style.display = '';
                document.body.style.paddingTop = 'calc((var(--card-height) * 2) + var(--border-width) + 5px)';
            }
            
            if (activeMode === 'build') {
                GT50Lib.Tabs.renderBuild(tabsContainer, currentContext.tabs, render);
            } else {
                GT50Lib.Tabs.renderView(tabsContainer, currentContext.tabs, render);
            }

        let focusedInput = null;
let initialViewportHeight = window.innerHeight;

// Scroll helper - positions input at consistent location (just above footer)
function scrollInputIntoView(input) {
    if (!input) return;
    
    setTimeout(() => {
        const rect = input.getBoundingClientRect();
        const currentHeight = window.visualViewport ? 
            window.visualViewport.height : window.innerHeight;
        
        // Footer total height: 67.5 base + 22.5 dropdown + 20 safety = 110px
        const footerSpace = 90;
        
        // Target: position input just above footer (110px from bottom)
        const targetPosition = currentHeight - footerSpace - (rect.height / 2);
        
        // Calculate how much to scroll to get input to target position
        const currentPosition = rect.top;
        const scrollAmount = currentPosition - targetPosition;
        
        // Always scroll to position input at target location
        if (Math.abs(scrollAmount) > 5) { // Only scroll if difference > 5px
            window.scrollBy({
                top: scrollAmount,
                behavior: 'smooth'
            });
        }
    }, 200); // Wait for keyboard animation
}

// Track when input gets focus
document.addEventListener('focusin', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        focusedInput = e.target;
        initialViewportHeight = window.visualViewport ? 
            window.visualViewport.height : window.innerHeight;
        scrollInputIntoView(focusedInput);
    }
});

document.addEventListener('focusout', () => {
    focusedInput = null;
});

// Handle keyboard open/close
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
        if (focusedInput) {
            const currentHeight = window.visualViewport.height;
            const heightDiff = initialViewportHeight - currentHeight;
            
            // Keyboard opened (viewport shrunk by more than 100px)
            if (heightDiff > 100) {
                scrollInputIntoView(focusedInput);
            }
        }
    });
}

window.addEventListener('beforeunload', saveState);
setInterval(saveState, 5000);
    </script>
