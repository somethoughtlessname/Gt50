<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT50 Import Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            background: #2a2a2a;
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #ffff00;
            margin-bottom: 10px;
        }
        .status {
            margin: 5px 0;
            padding: 5px;
        }
        .success {
            color: #00ff00;
        }
        .error {
            color: #ff0000;
        }
        .warning {
            color: #ffaa00;
        }
        .info {
            color: #00aaff;
        }
        button {
            background: #00ff00;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover {
            background: #00cc00;
        }
        .code {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 GT50 Import System Diagnostic</h1>
    
    <div class="section">
        <div class="title">📋 Import List Status</div>
        <div id="import-list-status">Checking...</div>
    </div>
    
    <div class="section">
        <div class="title">🔄 Import Loader Status</div>
        <div id="loader-status">Checking...</div>
    </div>
    
    <div class="section">
        <div class="title">📦 Registry Status</div>
        <div id="registry-status">Checking...</div>
    </div>
    
    <div class="section">
        <div class="title">🎯 Registered Imports</div>
        <div id="registered-imports">Checking...</div>
    </div>
    
    <div class="section">
        <div class="title">💡 Recommendations</div>
        <div id="recommendations"></div>
    </div>
    
    <button onclick="runDiagnostic()">🔄 Refresh Diagnostic</button>

    <script>
        function runDiagnostic() {
            // Check Import List
            const importListStatus = document.getElementById('import-list-status');
            if (window.GT50ImportsList) {
                importListStatus.innerHTML = `
                    <div class="status success">✓ Import list loaded</div>
                    <div class="status info">Files to load: ${window.GT50ImportsList.length}</div>
                    <div class="code">${JSON.stringify(window.GT50ImportsList, null, 2)}</div>
                `;
            } else {
                importListStatus.innerHTML = `
                    <div class="status error">✗ Import list not found</div>
                    <div class="status warning">window.GT50ImportsList is undefined</div>
                `;
            }
            
            // Check Import Loader
            const loaderStatus = document.getElementById('loader-status');
            if (window.GT50ImportsLoading !== undefined) {
                loaderStatus.innerHTML = `
                    <div class="status ${window.GT50ImportsLoading ? 'warning' : 'success'}">
                        Loading: ${window.GT50ImportsLoading}
                    </div>
                    <div class="status ${window.GT50ImportsReady ? 'success' : 'error'}">
                        Ready: ${window.GT50ImportsReady}
                    </div>
                `;
            } else {
                loaderStatus.innerHTML = `
                    <div class="status error">✗ Import loader not initialized</div>
                `;
            }
            
            // Check Registry
            const registryStatus = document.getElementById('registry-status');
            if (window.GT50 && window.GT50.Imports) {
                registryStatus.innerHTML = `
                    <div class="status success">✓ Registry system loaded</div>
                    <div class="status info">Registry object exists</div>
                `;
            } else {
                registryStatus.innerHTML = `
                    <div class="status error">✗ Registry system not loaded</div>
                    <div class="status warning">window.GT50.Imports is undefined</div>
                `;
            }
            
            // Check Registered Imports
            const registeredImports = document.getElementById('registered-imports');
            if (window.GT50 && window.GT50.Imports && window.GT50.Imports.getAll) {
                const imports = window.GT50.Imports.getAll();
                if (imports.length > 0) {
                    registeredImports.innerHTML = `
                        <div class="status success">✓ Found ${imports.length} registered import(s)</div>
                        <div class="code">${JSON.stringify(imports.map(imp => ({
                            id: imp.id,
                            name: imp.name,
                            description: imp.description
                        })), null, 2)}</div>
                    `;
                } else {
                    registeredImports.innerHTML = `
                        <div class="status error">✗ No imports registered</div>
                        <div class="status warning">Registry is empty</div>
                    `;
                }
            } else {
                registeredImports.innerHTML = `
                    <div class="status error">✗ Cannot access registry</div>
                `;
            }
            
            // Recommendations
            const recommendations = document.getElementById('recommendations');
            let recs = [];
            
            if (!window.GT50ImportsList || window.GT50ImportsList.length === 0) {
                recs.push('<div class="status warning">⚠ No import files listed in Imports-list.js</div>');
            }
            
            if (window.GT50 && window.GT50.Imports) {
                const imports = window.GT50.Imports.getAll();
                if (imports.length === 0 && window.GT50ImportsList && window.GT50ImportsList.length > 0) {
                    recs.push('<div class="status error">⚠ Import files listed but none registered - files may not exist or have errors</div>');
                    recs.push('<div class="status info">💡 Check if files exist at these paths:</div>');
                    window.GT50ImportsList.forEach(file => {
                        recs.push(`<div class="status info">   • uta/import/${file}</div>`);
                    });
                }
            }
            
            if (recs.length === 0) {
                recommendations.innerHTML = '<div class="status success">✓ Everything looks good!</div>';
            } else {
                recommendations.innerHTML = recs.join('');
            }
        }
        
        // Run diagnostic on load
        setTimeout(runDiagnostic, 1000);
        
        // Auto-refresh every 2 seconds to catch async loading
        setInterval(runDiagnostic, 2000);
    </script>
</body>
</html>
